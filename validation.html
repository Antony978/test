<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="css/validation.css">
</head>
<body>
  <main class="card">
    <header class="card__header">
      <h1>Create Account</h1>
      <p>Fill in the form below to register.</p>
    </header>

    <form id="registerForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="John Doe" autocomplete="name">
        <small class="error" id="nameError" role="alert"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        <small class="error" id="emailError" role="alert"></small>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password">
          <button type="button" class="toggle" id="togglePassword" aria-label="Show password">Show</button>
        </div>
        <div class="strength" id="strength" aria-hidden="true"><span></span></div>
        <small class="error" id="passwordError" role="alert"></small>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" autocomplete="new-password">
        <small class="error" id="confirmPasswordError" role="alert"></small>
      </div>

      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="18" min="1" max="120">
        <small class="error" id="ageError" role="alert"></small>
      </div>

      <button type="submit" class="submit">Register</button>
      <p class="success" id="successMessage" hidden>Registration successful! Welcome aboard.</p>
    </form>
  </main>

  <script src="js/validation.js"></script>
</body>
</html>
